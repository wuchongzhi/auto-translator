<!-- 所有动画只使用本地 HTML 和 CSS，无需下载图片、安装动画库或执行 JavaScript。 -->
<style>
/* 只为本动画命名空间设置样式，避免影响页面的其他组件。 */
.translation-loading { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 8px; height: 28px; padding: 0; margin: 0; box-sizing: border-box; }
/* 为缩小后的书本预留图标尺寸，不占用大块页面空间。 */
.translation-loading .book-slot { position: relative; width: 30px; height: 22px; flex: 0 0 30px; }
/* 将书本缩为约28像素宽，并保留立体翻页效果。 */
.translation-loading .book { position: relative; width: 96px; height: 62px; perspective: 450px; transform: scale(0.29) rotate(-8deg); transform-origin: top left; }
/* 左侧书封位于页面下方，并带有柔和阴影。 */
.translation-loading .cover { position: absolute; inset: 0; background: #6366f1; border-radius: 7px; box-shadow: 0 9px 20px #4f46e529; }
/* 左侧固定书页，使用细横线模拟纸上的文字。 */
.translation-loading .left-page { position: absolute; top: 4px; left: 4px; width: 44px; height: 52px; background: repeating-linear-gradient(to bottom, #fff 0 9px, #e4e7fa 9px 10px, #fff 10px 16px); border-radius: 4px 0 0 4px; }
/* 右侧固定书页与左侧共同形成打开的书本。 */
.translation-loading .right-page { position: absolute; top: 4px; left: 48px; width: 44px; height: 52px; background: repeating-linear-gradient(to bottom, #fff 0 9px, #e4e7fa 9px 10px, #fff 10px 16px); border-radius: 0 4px 4px 0; }
/* 书脊位于中央，使左右书页的结构更清楚。 */
.translation-loading .spine { position: absolute; left: 47px; top: 4px; width: 2px; height: 52px; background: #c7c9f4; }
/* 动态书页从右侧绕书脊翻向左侧，浏览器在后端等待时独立播放。 */
.translation-loading .turning-page { position: absolute; top: 4px; left: 48px; width: 44px; height: 52px; transform-origin: left center; background: repeating-linear-gradient(to bottom, #fff 0 9px, #dce0f8 9px 10px, #fff 10px 16px); border-radius: 0 4px 4px 0; animation: translator-page-turn 2.4s ease-in-out infinite; opacity: 0; }
/* 第二张书页延后启动，形成连续翻页效果。 */
.translation-loading .turning-page.second { animation-delay: 0.8s; }
/* 第三张书页继续错开时间，让书页循环翻动。 */
.translation-loading .turning-page.third { animation-delay: 1.6s; }
/* 等待文字使用与前端主按钮一致的蓝紫色。 */
.translation-loading .message { margin: 0; color: #64748b; font-family: sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.02em; text-align: center; }
/* 每张书页在一个周期内从右向左翻转，再隐藏复位。 */
@keyframes translator-page-turn { 0%, 5% { transform: rotateY(0deg); opacity: 0; } 10% { opacity: 1; } 40% { transform: rotateY(-90deg); opacity: 1; } 70% { transform: rotateY(-180deg); opacity: 1; } 80%, 100% { transform: rotateY(-180deg); opacity: 0; } }
/* 尊重减少动态效果的系统设置，关闭翻页但保留书本与等待文字。 */
@media (prefers-reduced-motion: reduce) { .translation-loading .turning-page { animation: none; opacity: 0; } }
</style>
<!-- 等待区作为状态信息呈现，便于辅助阅读工具识别。 -->
<div class="translation-loading" role="status" aria-live="polite">
  <!-- 书本图形仅作装饰，避免辅助阅读工具重复朗读。 -->
  <!-- 用小图标容器限制书本在页面中的占位。 -->
  <div class="book-slot" aria-hidden="true">
  <div class="book">
    <!-- 绘制书本封面。 -->
    <div class="cover"></div>
    <!-- 绘制左侧书页。 -->
    <div class="left-page"></div>
    <!-- 绘制右侧书页。 -->
    <div class="right-page"></div>
    <!-- 绘制书本中央书脊。 -->
    <div class="spine"></div>
    <!-- 绘制第一张翻动的书页。 -->
    <div class="turning-page"></div>
    <!-- 绘制第二张翻动的书页。 -->
    <div class="turning-page second"></div>
    <!-- 绘制第三张翻动的书页。 -->
    <div class="turning-page third"></div>
  </div>
  <!-- 结束小图标容器。 -->
  </div>
  <!-- 显示用户指定的等待提示。 -->
  <p class="message">AI正在努力翻译ing……</p>
</div>
